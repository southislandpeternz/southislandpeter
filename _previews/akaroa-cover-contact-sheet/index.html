<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿卡罗阿封面候选 · Contact Sheet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #eceae6;
      color: #222;
      padding: clamp(20px, 4vw, 40px);
    }
    header {
      max-width: 1200px;
      margin: 0 auto 28px;
    }
    header h1 {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 600;
      margin-bottom: 8px;
    }
    header p {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    .sheet-jpg {
      max-width: 1200px;
      margin: 0 auto 32px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
    }
    .sheet-jpg img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .sheet-jpg figcaption {
      margin-top: 10px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    figure {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.07);
    }
    figure img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    figcaption {
      padding: 14px 16px;
    }
    figcaption strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
      word-break: break-all;
    }
    figcaption span {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 92vh;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>阿卡罗阿法国小镇一日游 · 封面候选 Contact Sheet</h1>
    <p>来源：<code>NZ-Travel-photos/akaroa</code> · 共 5 张 · 仅供人工选图预览 · 未修改网站</p>
  </header>

  <figure class="sheet-jpg">
    <img src="akaroa-cover-contact-sheet.jpg" alt="联系表合成图">
    <figcaption>合成联系表 · akaroa-cover-contact-sheet.jpg</figcaption>
  </figure>

  <div class="grid">
    <figure>
      <img src="thumbs/IMG_7422-thumb.jpg" alt="IMG_7422.JPG" data-full="thumbs/IMG_7422.JPG">
      <figcaption>
        <strong>IMG_7422.JPG</strong>
        <span>阿卡罗阿海湾俯瞰 + 羊驼 · 4032×3024</span>
      </figcaption>
    </figure>
    <figure>
      <img src="thumbs/IMG_7454-thumb.jpg" alt="IMG_7454.JPG" data-full="thumbs/IMG_7454.JPG">
      <figcaption>
        <strong>IMG_7454.JPG</strong>
        <span>海湾 + 羊驼农场 · 3892×2919</span>
      </figcaption>
    </figure>
    <figure>
      <img src="thumbs/IMG_7113-thumb.jpg" alt="IMG_7113.jpeg" data-full="thumbs/IMG_7113.jpeg">
      <figcaption>
        <strong>IMG_7113.jpeg</strong>
        <span>海岸灯塔 + 海豹 · 5712×4284</span>
      </figcaption>
    </figure>
    <figure>
      <img src="thumbs/IMG_6399-thumb.jpg" alt="IMG_6399.jpeg" data-full="thumbs/IMG_6399.jpeg">
      <figcaption>
        <strong>IMG_6399.jpeg</strong>
        <span>班克斯半岛观景点 · 4532×3398</span>
      </figcaption>
    </figure>
    <figure>
      <img src="thumbs/IMG_6486-thumb.jpg" alt="IMG_6486.jpeg" data-full="thumbs/IMG_6486.jpeg">
      <figcaption>
        <strong>IMG_6486.jpeg</strong>
        <span>羊驼农场互动 · 4032×3024</span>
      </figcaption>
    </figure>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="大图预览">
    <button class="lightbox-close" type="button" aria-label="关闭">&times;</button>
    <img id="lightboxImg" alt="">
  </div>

  <script>
    (function () {
      var lb = document.getElementById("lightbox");
      var lbImg = document.getElementById("lightboxImg");
      document.querySelectorAll(".grid img").forEach(function (img) {
        img.addEventListener("click", function () {
          lbImg.src = img.dataset.full || img.src;
          lb.classList.add("is-open");
        });
      });
      lb.querySelector(".lightbox-close").addEventListener("click", function () {
        lb.classList.remove("is-open");
      });
      lb.addEventListener("click", function (e) {
        if (e.target === lb) lb.classList.remove("is-open");
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") lb.classList.remove("is-open");
      });
    })();
  </script>
</body>
</html>
